[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
# E, W: PEP-8 errors & warnings (pycodestyle)
# F: Pyflakes
# N: pep8-naming conventions
# I: isort (import sorting)
# DJ: flake8-django rules
select = ["E", "W", "F", "N", "I", "DJ"]
ignore = [
    "E501",  # Line length is handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
# Django settings can have wildcard imports or specific structure
"mysite/settings.py" = ["F403", "F405", "E501"]
"*/settings.py" = ["F403", "F405", "E501"]
"manage.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
format_css = true
format_js = true
ignore = "H006,H031"
